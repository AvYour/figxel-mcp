name: release

# Publishes figxel-mcp to npm and creates the GitHub Release, with the Figma
# plugin as a zip, when a tag v<version> is pushed. The tag must equal "v" plus
# package.json's version.
#
# npm publishes through trusted publishing (OIDC): on npmjs.com, figxel-mcp's
# Settings → Trusted publishing names user AvYour, repository figxel-mcp and
# workflow release.yml, with direct `npm publish` allowed [C-420]. The npm CLI
# tries OIDC first and falls back to a token [C-421], so the repository secret
# NPM_TOKEN stays as that fallback until a release has gone out through OIDC;
# then delete the secret and disallow tokens for the package (CONTRIBUTING.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # gh release create
  id-token: write # trusted publishing (OIDC) and provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: The tag is v + package.json's version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json's version ($expected)"
            exit 1
          fi
      # Trusted publishing needs npm 11.5.1 or later [C-420].
      - run: npm install -g npm@11
      - run: npm ci
      # Typecheck, tests (which build dist/) and the documentation gates.
      - run: npm run check
      - run: node scripts/check-language.mjs
      # prepack builds dist/ again from this checkout, so the tarball holds only the "files" in package.json.
      # OIDC when the trusted publisher is set up, else the token; --provenance for the token path.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Zip the plugin
        run: zip -X -j "figxel-plugin-${GITHUB_REF_NAME}.zip" dist/plugin/* LICENSE
      # A release made by hand before this run (when npm publishing was blocked) gets the zip instead.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "figxel-plugin-${GITHUB_REF_NAME}.zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "figxel-plugin-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
